
name: Adebola College Staging Build

on:
  push:
    branches:
      - feature/adebola-github-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ADEBOLACOLLEGE/ADEBOLAPROD

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: ADEBOLACOLLEGE/ADEBOLAPROD/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify staging Supabase configuration
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.ADEBOLA_STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ADEBOLA_STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::ADEBOLA_STAGING_SUPABASE_URL is missing or empty."
            exit 1
          fi

          if [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::ADEBOLA_STAGING_SUPABASE_PUBLISHABLE_KEY is missing or empty."
            exit 1
          fi

          if [ "$NEXT_PUBLIC_SUPABASE_URL" != "https://jmxuffazlpcdwcpqnjau.supabase.co" ]; then
            echo "::error::The staging build is not configured for the approved development Supabase project."
            exit 1
          fi

          echo "Staging Supabase URL and publishable-key secret are present."
          echo "The build target is the approved development project."

      - name: Build production application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.ADEBOLA_STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ADEBOLA_STAGING_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://staging.adebolacollege.org

      - name: Package production application
        run: |
          tar -czf "$GITHUB_WORKSPACE/adebola-staging-build.tar.gz" \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.next/cache \
            --exclude='.env*' \
            .

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: adebola-staging-build
          path: adebola-staging-build.tar.gz
          retention-days: 7
